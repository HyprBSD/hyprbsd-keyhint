[package]
name = "hyprbsd-keyhint"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "Shows the key binding for a program opened from HyprBSD's launcher, menu or bar"
publish = false

[dependencies]
gio-unix = "0.22"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
