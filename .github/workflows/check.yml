# On every push and pull request: rustfmt's check and cargo-deny on Linux, and make check in
# FreeBSD 15.1, its session test under a headless sway.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          cpu: 4
          mem: 8192
          copyback: false
          cache-after-prepare: true
          prepare: pkg install -y git rust pkgconf gtk4 gtk4-layer-shell sway grim jq wtype python312 py312-pygobject dbus
          run: make check
